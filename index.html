<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার মিনি অ্যাপ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 20px;
        }
        h1 { color: #2481cc; }
        .btn {
            background-color: #2481cc;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>স্বাগতম আমার মিনি অ্যাপে!</h1>
    <p>এখানে বিজ্ঞাপন দেখে আয় করার সিস্টেম থাকবে।</p>
    
    <button class="btn" onclick="watchAd()">বিজ্ঞাপন দেখুন (বোনাস নিন)</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function watchAd() {
            alert("এখানে বিজ্ঞাপন লোড হবে!");
        }
    </script>

</body>
</html>
